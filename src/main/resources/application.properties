# Base de datos H2 en memoria (se vacía al detener la aplicación)
spring.datasource.url=jdbc:h2:mem:biblioteca
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT: en producción definir la variable de entorno JWT_SECRET (mínimo 32 caracteres)
jwt.secret=${JWT_SECRET:clave-de-desarrollo-biblioteca-api-fca-unam-2027}
# Duración del token: 1 hora
jwt.expiration-ms=3600000
